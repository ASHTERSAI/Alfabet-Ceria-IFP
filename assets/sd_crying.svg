<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 210" fill="none">
  <style>
    @keyframes tearStream {
      0% { transform: translateY(0px) scaleY(0.85); opacity: 0.95; }
      70% { transform: translateY(22px) scaleY(1.15); opacity: 0.9; }
      100% { transform: translateY(34px) scaleY(0.7); opacity: 0; }
    }
    @keyframes bodySob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(3px); }
    }
    @keyframes handWipe {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-6deg); }
    }
    .sob-group { animation: bodySob 0.55s ease-in-out infinite; transform-origin: 90px 150px; }
    .tear-l1 { animation: tearStream 0.85s ease-in infinite; }
    .tear-l2 { animation: tearStream 0.85s ease-in 0.42s infinite; }
    .tear-r1 { animation: tearStream 0.85s ease-in 0.2s infinite; }
    .tear-r2 { animation: tearStream 0.85s ease-in 0.62s infinite; }
    .arm-wipe { animation: handWipe 0.55s ease-in-out infinite; transform-origin: 54px 116px; }
  </style>

  <ellipse cx="90" cy="198" rx="44" ry="7" fill="#CBD5E1" opacity="0.6"/>

